name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev libcurl4-openssl-dev
      - name: Configure client and tests
        run: cmake -S torrent-client-prototype -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test without downloading torrents
        run: ctest --test-dir build --output-on-failure
